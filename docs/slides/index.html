<div class="kicker">UNDERGRADUATE PROJECT · 專題成果</div>
<h1>STM32F103<br />四旋翼飛控系統</h1>
<div class="sub">FreeRTOS · Fusion AHRS · 串級 PID<br />nRF24L01P 無線遙測與線上調參</div>
<div class="meta">
報告人：<em>待補（姓名／系所）</em><br />
F450 機架實飛驗證　·　韌體版本 <code>2040300</code><br />
github.com/ZHANG-XICHANG/stm32f103-flight-controller
</div>
</div>
<div class="right" style="background-image:url(assets/img/flight-test.png)"></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-theme="fc-dark" data-lang="zh-TW" lang="zh-TW" data-marpit-pagination="2" style="--paginate:true;--theme:fc-dark;--lang:zh-TW;" data-marpit-pagination-total="15" data-size="16:9">
<h2 id="%E7%A0%94%E7%A9%B6%E5%8B%95%E6%A9%9F">研究動機</h2>
<div class="cols three">
<div class="card">
<h3>01　打通飛控全鏈路</h3>
<p>從感測、姿態估測、閉迴路控制到馬達輸出，每一層都自己實作並能解釋，而不是直接套用現成飛控韌體。</p>
</div>
<div class="card">
<h3>02　低資源 MCU 的即時控制</h3>
<p>STM32F103（72 MHz Cortex-M3）上以 FreeRTOS 排程：感測、控制、無線通訊與狀態顯示需在固定週期內完成。</p>
</div>
<div class="card">
<h3>03　以資料驅動調參</h3>
<p>串級 PID 調參若只靠目視很難重現。自建遙測鏈路，把每一筆控制內部狀態記錄成 CSV，再用時域與頻域分析。</p>
</div>
</div>
<h3 style="margin-top:30px">本專題自行實作的範圍</h3>
<div class="flow">
<div class="node"><b>感測</b>MPU6050 驅動<br />開機校正</div><div class="arrow">→</div>
<div class="node hl"><b>姿態估測</b>濾波 + Fusion AHRS</div><div class="arrow">→</div>
<div class="node hl"><b>控制</b>串級 PID<br />狀態機</div><div class="arrow">→</div>
<div class="node"><b>致動</b>X 型混控<br />TIM4 PWM</div><div class="arrow">→</div>
<div class="node"><b>通訊</b>nRF24 封包<br />失聯保護</div><div class="arrow">→</div>
<div class="node hl"><b>觀測</b>ACK 遙測<br />線上調參 GUI</div>
</div>
<div class="card" style="margin-top:6px;border-color:var(--accent)">
<p style="margin:0"><strong>研究問題：</strong>在 6 ms 控制週期、無磁力計的條件下，如何讓 F450 四旋翼穩定飛行？調參時觀察到的振盪從何而來？</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-footer="來源：Core/Src/freertos.c:46 · flight.c:270-301, 308-450 · tim.c:45-47 · telemetry.c · docs/data/" data-theme="fc-dark" data-lang="zh-TW" lang="zh-TW" data-marpit-pagination="3" style="--paginate:true;--footer:來源：Core/Src/freertos.c:46 · flight.c:270-301, 308-450 · tim.c:45-47 · telemetry.c · docs/data/;--theme:fc-dark;--lang:zh-TW;" data-marpit-pagination-total="15" data-size="16:9">

<h2 id="%E8%BB%9F%E9%AB%94%E6%9E%B6%E6%A7%8Bfreertos-%E4%B8%89%E4%BB%BB%E5%8B%99">軟體架構：FreeRTOS 三任務</h2>
<div class="cols" style="grid-template-columns:1.15fr 1fr">
<div class="fig"><img src="assets/diagrams/freertos-dataflow.png" /><div class="cap">Archify 產生，依原始碼追蹤（深色匯出）</div></div>
<div>
<table>
<thead>
<tr>
<th>任務</th>
<th>優先權</th>
<th>週期</th>
<th>職責</th>
</tr>
</thead>
<tbody>
<tr>
<td>飛控</td>
<td>High</td>
<td>6 ms</td>
<td>狀態機 → 姿態 → PID → 混控 → 遙測快照</td>
</tr>
<tr>
<td>通訊</td>
<td>Normal</td>
<td>6 ms</td>

</tr>

<div class="tiny muted" style="margin-top:4px">優先權與週期皆為程式設定值，非實測執行時間</div>
<p class="small" style="margin-top:14px">全部以 <code>vTaskDelayUntil</code> 固定週期喚醒；<strong>未使用 Queue / Semaphore / Mutex</strong>。</p>
<p class="small">遙測以快照交換；<code>remoteData</code> 仍是共享結構，尚無整包原子快照。</p>
</div>

<th>方向 / 內容</th>
</tr>
</thead>
<tbody>
<tr>
<td>控制</td>
<td><strong>17 B</strong></td>
<td>遙控器 → 飛控：油門、三軸、事件</td>
</tr>
<tr>
<td>PID 命令</td>
<td><strong>24 B</strong></td>
<td>'PI' 標頭 + 增益 + CRC16</td>
</tr>
<tr>
<td>遙測 ACK</td>
<td><strong>31 B</strong></td>
<td>飛控 → 遙控器：所選軸 PID + 4 路 PWM</td>
</tr>
</tbody>
</table>
<p class="small" style="margin-top:12px"><span class="tag code">程式碼</span>CH40 · 2 Mbps · 0 dBm · 自動重傳 500 µs × 5</p>
<p class="small"><span class="tag code">程式碼</span>超過 1000 ms 未收到有效封包 → <code>FAIL</code>，馬達送最低脈寬</p>
<p class="small muted">ACK 為預先載入的上一筆快照，不是本次接收後即時計算的結果。</p>
</div>
<div class="fig"><img src="assets/diagrams/ack-sequence-control.png" style="max-height:520px;object-fit:contain" /><div class="cap">控制封包與 ACK Payload 時序（Archify 產生）</div></div>
</div>
<footer>來源：Core/Inc/nRF24L01P.h:42-48 · receive.c:15-140 · pid_command.c · telemetry.c · flight_state.c</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-footer="資料：docs/data/run-*.csv（原始 telemetry*.csv 未修改副本）· 分析腳本：presentations/tools/make-figures.py" data-theme="fc-dark" data-lang="zh-TW" lang="zh-TW" data-marpit-pagination="11" style="--paginate:true;--footer:資料：docs/data/run-*.csv（原始 telemetry*.csv 未修改副本）· 分析腳本：presentations/tools/make-figures.py;--theme:fc-dark;--lang:zh-TW;" data-marpit-pagination-total="15" data-size="16:9">
<h2 id="%E5%AF%A6%E9%A9%97%E6%96%B9%E6%B3%95">實驗方法</h2>
<div class="flow" style="margin-bottom:22px">
<div class="node hl"><b>飛控</b>每 6 ms 擷取遙測快照</div><div class="arrow">→</div>
<div class="node"><b>nRF24 ACK</b>31 B payload</div><div class="arrow">→</div>
<div class="node"><b>遙控器</b>USB 轉發</div><div class="arrow">→</div>
<div class="node"><b>電腦</b>serial_scope.py / pid_tune.py</div><div class="arrow">→</div>
<div class="node hl"><b>CSV 分析</b>時域 · FFT · 增益回推</div>
</div>
<div class="cols w46">
<div class="fig"><img src="assets/img/tuning-rig.png" style="max-height:330px;object-fit:contain" /><div class="cap">測試架調參（實拍）</div></div>
<div>
<ul class="small">
<li><span class="tag measured">實測</span>6 份 CSV（2026-09-21 / 22，測試架調參階段），只記錄 <strong>X 軸（Roll）</strong></li>
<li>前處理：去除重複序號；依序號重建 6 ms 等間隔序列，缺口線性內插</li>
<li>頻譜：去平均、Hann 窗、FFT，於 2–10 Hz 取峰值</li>
<li><span class="tag derived">推算</span>外環 Kp：最小平方擬合 目標角速度 ≈ −k·roll + c；內環 Kp：P 項 ÷ 誤差 中位數</li>
<li><span class="tag missing">待補</span>測試條件（是否裝槳、油門、電壓、擾動方式）未記錄</li>
</ul>
</div>
</div>
<footer>資料：docs/data/run-<em>.csv（原始 telemetry</em>.csv 未修改副本）· 分析腳本：presentations/tools/make-figures.py</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-footer="指標由 CSV 直接計算：擾動起點 11.69 s（|ω| &gt; 20 °/s），最後 |ω| ≥ 15 °/s 於 12.80 s" data-theme="fc-dark" data-lang="zh-TW" lang="zh-TW" data-marpit-pagination="12" style="--paginate:true;--footer:指標由 CSV 直接計算：擾動起點 11.69 s（|ω| &gt; 20 °/s），最後 |ω| ≥ 15 °/s 於 12.80 s;--theme:fc-dark;--lang:zh-TW;" data-marpit-pagination-total="15" data-size="16:9">
<h2 id="%E7%B5%90%E6%9E%9C%E5%88%86%E6%9E%90-%E2%91%A0%E6%93%BE%E5%8B%95%E5%BE%8C%E7%9A%84%E8%A1%B0%E6%B8%9B%E6%8C%AF%E7%9B%AA">結果分析 ①：擾動後的衰減振盪</h2>
<div class="cols w64">
<div class="fig"><img src="assets/figures/event-p2.3.png" /><div class="cap"><span class="tag measured">實測</span>telemetry_p_2.3.csv，10.5–15.5 s（未經平滑，只去除重複序號）</div></div>
<div>
<div class="kpis" style="grid-template-columns:1fr 1fr;margin:0 0 16px">
<div class="kpi"><b>98.8</b><span>角速度峰值 °/s</span></div>
<div class="kpi"><b>−11.1°</b><span>Roll 最大偏移</span></div>
<div class="kpi"><b>≈1.1 s</b><span>回到 |ω| &lt; 15 °/s</span></div>
<div class="kpi"><b>≈4 週</b><span>過零 8 次</span></div>
</div>
<ul class="small">
<li>振盪<strong>逐週期衰減</strong>：內環穩定，但阻尼不足</li>
<li>量測角速度振幅遠大於目標角速度——振盪主要發生在<strong>內環</strong></li>
</ul>
<p class="tiny muted">此記錄回推增益：外環 ≈ 3.0、內環 ≈ 2.25（早期調參，與現行原始碼不同）</p>
</div>
</div>
<footer>指標由 CSV 直接計算：擾動起點 11.69 s（|ω| &gt; 20 °/s），最後 |ω| ≥ 15 °/s 於 12.80 s</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-footer="另兩份大角度記錄（p_2.33、D_0.12）2–10 Hz 峰值落在 3.6–3.7 Hz，受低頻擺動影響，未列入表格" data-theme="fc-dark" data-lang="zh-TW" lang="zh-TW" data-marpit-pagination="13" style="--paginate:true;--footer:另兩份大角度記錄（p_2.33、D_0.12）2–10 Hz 峰值落在 3.6–3.7 Hz，受低頻擺動影響，未列入表格;--theme:fc-dark;--lang:zh-TW;" data-marpit-pagination-total="15" data-size="16:9">
<h2 id="%E7%B5%90%E6%9E%9C%E5%88%86%E6%9E%90-%E2%91%A1%E6%8C%AF%E7%9B%AA%E9%A0%BB%E7%8E%87%E9%9B%86%E4%B8%AD%E5%9C%A8-37%E2%80%9345-hz">結果分析 ②：振盪頻率集中在 3.7–4.5 Hz</h2>
<div class="cols w64">
<div class="fig"><img src="assets/figures/spectrum.png" /><div class="cap"><span class="tag measured">實測</span>gyro_x_deg_s 振幅頻譜（各自以 2–10 Hz 峰值正規化）</div></div>
<div>
<table>
<thead>
<tr>
<th>記錄</th>
<th>長度</th>
<th>覆蓋率</th>
<th>峰值</th>
</tr>
</thead>
<tbody>
<tr>
<td>p_2.3</td>
<td>21.1 s</td>
<td>84.0%</td>
<td><strong>3.95 Hz</strong></td>
</tr>
<tr>
<td>D_0.13</td>
<td>33.2 s</td>
<td>87.1%</td>
<td><strong>3.74 Hz</strong></td>
</tr>
<tr>
<td>new</td>
<td>84.1 s</td>
<td>92.3%</td>
<td><strong>4.45 Hz</strong></td>
</tr>
</tbody>
</table>
<p class="small" style="margin-top:14px">三份小角度擾動記錄的主頻都落在<strong>陀螺低通截止頻率（≈ 4.3 Hz）附近</strong>。</p>
<p class="small"><span class="tag derived">推論</span>濾波相位落後 + 馬達延遲 + D 項低通 + 一個週期計算延遲 → 內環在 4 Hz 附近相位裕度不足。<em>待對照實驗驗證。</em></p>
</div>
</div>
<footer>另兩份大角度記錄（p_2.33、D_0.12）2–10 Hz 峰值落在 3.6–3.7 Hz，受低頻擺動影響，未列入表格</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-footer="來源：docs/assets/img/tuning/ · Core/Src/com_pid.c · flight.c:190-201 · freertos.c:162-170 · flight_state.c" data-theme="fc-dark" data-lang="zh-TW" lang="zh-TW" data-marpit-pagination="14" style="--paginate:true;--footer:來源：docs/assets/img/tuning/ · Core/Src/com_pid.c · flight.c:190-201 · freertos.c:162-170 · flight_state.c;--theme:fc-dark;--lang:zh-TW;" data-marpit-pagination-total="15" data-size="16:9">
<h2 id="%E5%95%8F%E9%A1%8C%E8%88%87%E6%94%B9%E5%96%84">問題與改善</h2>
<div class="cols w46">
<div>
<div class="fig" style="margin-bottom:10px"><img src="assets/img/inner-3-0-0.jpg" style="max-height:200px;object-fit:contain" /><div class="cap"><span class="tag measured">截圖</span>內環 Kp 3：擾動後數次振盪即恢復</div></div>
<div class="fig"><img src="assets/img/inner-5-0-0.jpg" style="max-height:200px;object-fit:contain" /><div class="cap"><span class="tag measured">截圖</span>內環 Kp 5：振盪逐週期放大 → 發散</div></div>
</div>
<div>
<table>
<thead>
<tr>
<th>觀察到的問題</th>
<th>改善方向</th>
</tr>
</thead>
<tbody>
<tr>
<td>4 Hz 振盪、提高 Kp 即發散</td>
<td>Gyro 截止提高到 20–40 Hz，或改二階低通 / 陷波</td>
</tr>
<tr>
<td>控制率 166.7 Hz</td>
<td>內環 500 Hz–1 kHz，外環維持低頻</td>
</tr>
<tr>
<td>PID 無積分限幅、停機不重置</td>
<td>Anti-windup、解鎖 / 停機時重置狀態</td>
</tr>
<tr>
<td>IMU 讀取失敗沿用舊姿態；校準失敗不阻擋</td>
<td>失敗計數 → 進入 <code>FAIL</code></td>
</tr>
<tr>
<td>失聯恢復自動回 <code>NORMAL</code></td>
<td>恢復後要求重新解鎖</td>
</tr>
<tr>
<td><code>remoteData</code> 共享無原子快照</td>
<td>改為雙緩衝 / 臨界區整包複製</td>
</tr>
</tbody>
</table>
<p class="tiny muted">左欄為 PID/ 資料夾中的調參工具截圖（舊版 GUI，時間軸為電腦接收時間）</p>
</div>
</div>
<footer>來源：docs/assets/img/tuning/ · Core/Src/com_pid.c · flight.c:190-201 · freertos.c:162-170 · flight_state.c</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="fc-dark" data-lang="zh-TW" lang="zh-TW" data-marpit-pagination="15" style="--paginate:true;--theme:fc-dark;--lang:zh-TW;" data-marpit-pagination-total="15" data-size="16:9">
<h2 id="%E7%B5%90%E8%AB%96%E8%88%87%E6%9C%AA%E4%BE%86%E7%A0%94%E7%A9%B6">結論與未來研究</h2>
<div class="cols">
<div>
<h3>結論</h3>
<ul class="small">
<li>在 STM32F103 + FreeRTOS 上完成 <strong>感測 → AHRS → 串級 PID → 混控 → PWM</strong> 全鏈路，並於 F450 實飛</li>
<li>自建 <strong>ACK Payload 遙測 + 線上調參</strong>，讓調參有資料可追溯</li>
<li>實測資料顯示內環存在 <strong>3.7–4.5 Hz</strong> 的衰減振盪，與陀螺低通截止同量級，指出下一步的改善重點</li>
</ul>
<h3 style="margin-top:18px">未來研究</h3>
<ul class="small">
<li>掃頻量測內環開迴路頻率響應，做系統識別與頻域設計</li>
<li>只改變濾波截止頻率的對照實驗，驗證相位裕度推論</li>
<li>比較 PID 與模型為基礎的控制（如 LQR / ADRC）</li>
<li>加入氣壓計 / 磁力計，實作定高與航向保持</li>
</ul>
</div>
<div>
<div class="card">
<h3><span class="tag missing">待補</span>尚缺的實驗資料</h3>
<ul>
<li>以現行增益（7 / 0.5）錄製的 CSV；現有 CSV 皆為早期增益</li>
<li>Pitch、Yaw 軸遙測（目前只有 X 軸）</li>
<li>步階響應：過衝、上升時間、穩定時間</li>
<li>實飛遙測，以及影片與資料的時間對照</li>
<li>任務執行時間（CPU 負載）與封包遺失率</li>
<li>每次記錄的測試條件（裝槳、油門、電壓、擾動方式）</li>
</ul>
</div>
<p class="tiny muted" style="margin-top:14px">專題網站：zhang-xichang.github.io/stm32f103-flight-controller ・ 實飛影片：youtu.be/hEEcJP3LDC0</p>
</div>
</div>
</section>
